<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nightmail · Send more email</title>
    <meta name="description" content="Transactional email, newsletters, campaigns and inbound conversations. $0.20 per 1,000 emails, sent or received." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <main class="page" id="page" data-phase="idle">
      <canvas class="gl" id="gl" aria-hidden="true"></canvas>
      <a class="wordmark" href="#" aria-label="Nightmail"><img src="/commercial/brand/nightmail-wordmark-280-reversed.svg" alt="Nightmail" width="161" height="15" /></a>
      <button class="sound" id="sound" type="button" aria-pressed="true" aria-label="Mute">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8v4h3l4 3V5L6 8z" /><path class="sound__on" d="M13 7.5a3.5 3.5 0 0 1 0 5M15.2 5.5a6.5 6.5 0 0 1 0 9" fill="none" /><path class="sound__off" d="m13.5 8 4 4m0-4-4 4" fill="none" /></svg>
      </button>
      <!-- the tube and the dial are drawn in WebGPU; these sit on top of them to take the click -->
      <button class="glass" id="glass" type="button" tabindex="-1" aria-hidden="true"></button>
      <button class="dial" id="dial" type="button" aria-label="Tune in: play the Nightmail commercial, one minute, with sound"></button>
      <p class="nogpu" id="nogpu" hidden>THIS BROADCAST NEEDS WEBGPU. TRY A RECENT CHROME, EDGE OR SAFARI.</p>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
