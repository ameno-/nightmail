    <!-- The tab icon (docs/brand.md): the stamp's crescent on a rounded tile, as a vector by the browser's own theme (an ink
         tile on a pale one, a paper tile on a dark one), and in the .ico at 16 and 32 px. The .ico's link names 32x32
         alone: where it also names 16x16, Chrome takes the .ico over the vectors and a dark tab strip never gets the paper
         tile. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" media="(prefers-color-scheme: light)" />
