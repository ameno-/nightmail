name: Homepage media
run-name: Promote homepage media ${{ inputs.set }} ${{ inputs.version }} to production

# Copies a render set already published on dev (app/scripts/factory-media.mjs publish, then checked at
# https://dev.nightmail.dev) to production's media bucket, and points production's homepage at it. It reads the version
# from dev's public media host, checks every file against the version's files.json, writes with a short-lived token
# minted for production (no stored Cloudflare credential), and changes no code: the next homepage load plays it.
# Dispatch on the production branch: gh workflow run media.yml --ref production -f version=<version>
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version on media.dev.nightmail.dev to promote (factory/<set>/<version>/, e.g. 2026-11-18-b3bbec73)
        required: true
        type: string
      set:
        description: Render set
        type: choice
        options: [desktop, phone]
        default: desktop
      dry-run:
        description: Check and list what would be copied; write nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: homepage-media-production
  cancel-in-progress: false

jobs:
  promote:
    name: Promote ${{ inputs.set }} ${{ inputs.version }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      CF_ACCOUNT_ID: 15d29c8639fd3733b1b5486a2acfd968
      VERSION: ${{ inputs.version }}
      SET: ${{ inputs.set }}
      DRY_RUN: ${{ inputs.dry-run }}
    steps:
      # The same people who may deploy production, from the production branch, while production is not frozen.
      - name: Require production, an authorized actor and a valid version
        env:
          ACTOR: ${{ github.triggering_actor }}
          PUSHER: ${{ github.actor }}
          PROD_DEPLOY_ENABLED: ${{ vars.PROD_DEPLOY_ENABLED }}
        run: |
          [[ $GITHUB_REF == refs/heads/production ]] || { echo "::error::Dispatch this on the production branch."; exit 1; }
          for who in "$ACTOR" "$PUSHER"; do [[ $who =~ ^(thdxr|R44VC0RP)$ ]] || { echo "::error::Only thdxr and R44VC0RP may promote ($who)."; exit 1; }; done
          [[ $PROD_DEPLOY_ENABLED == true ]] || { echo "::error::Production deploys are frozen. Set PROD_DEPLOY_ENABLED=true to promote."; exit 1; }
          [[ $VERSION =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]{8}$ ]] || { echo "::error::Bad version: $VERSION"; exit 1; }

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Authenticate with AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/nightmail-production
          aws-region: us-east-1

      - name: Mint a short-lived Cloudflare token
        id: cloudflare
        uses: ./.github/actions/cloudflare-token
        with:
          account-id: ${{ env.CF_ACCOUNT_ID }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # The API package's locked Wrangler writes the objects.
      - name: Install Wrangler
        working-directory: api
        run: bun install --frozen-lockfile

      - name: Promote
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.cloudflare.outputs.token }}
          WRANGLER: ${{ github.workspace }}/api/node_modules/.bin/wrangler
        run: |
          args=(promote "$VERSION" --set "$SET" --stage production)
          if [[ $DRY_RUN == true ]]; then args+=(--dry-run); fi
          node app/scripts/factory-media.mjs "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check production serves it
        if: inputs.dry-run != true
        run: |
          current=$(curl --fail --silent --show-error --max-time 20 "https://media.nightmail.dev/factory/$SET/current.json?check=$GITHUB_RUN_ID" | jq -er '.version')
          [[ $current == "$VERSION" ]] || { echo "::error::media.nightmail.dev names $current, not $VERSION"; exit 1; }
          echo "media.nightmail.dev/factory/$SET/current.json names $VERSION." >> "$GITHUB_STEP_SUMMARY"
