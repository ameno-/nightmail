name: Build release
description: Install locked release dependencies and build Worker assets and the SDK CLI
runs:
  using: composite
  steps:
    - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
      with:
        node-version: 24.16.0
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.14
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.bun/install/cache
        key: release-bun-1.3.14-${{ github.ref_name }}-${{ runner.arch }}-${{ hashFiles('api/bun.lock', 'app/bun.lock', 'sdk/bun.lock') }}
    - shell: bash
      run: |
        (cd sdk && bun install --frozen-lockfile && bun run build) & sdk=$!
        (cd api && bun install --frozen-lockfile) & api=$!
        (cd app && bun install --frozen-lockfile)
        (cd app && bun run build)
        wait "$api"
        wait "$sdk"
        node .github/scripts/retain-assets.mjs "$VITE_PUBLIC_URL"
