name: Build CLS dashboard
description: Prepare this checkout's dashboard and Playwright's Chrome for Testing
runs:
  using: composite
  steps:
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/ms-playwright
        key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/node_modules/playwright-core/browsers.json') }}
    - shell: bash
      working-directory: app
      run: |
        ./node_modules/.bin/playwright-core install --no-shell chromium
        chrome=$(node -p "require('playwright-core').chromium.executablePath()")
        echo "CLS_CHROME=$chrome" >> "$GITHUB_ENV"
    # Vite embeds the full checkout's build identity. No prefix fallback or sharing with privileged deploy builds.
    - id: dist
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: app/dist
        key: cls-dist-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
    - if: steps.dist.outputs.cache-hit != 'true'
      shell: bash
      working-directory: app
      run: ./node_modules/.bin/vite build
